site_name: My KB
site_description: Personal knowledge base
site_url: https://icerdv10086.github.io/my-knowledge-base/
site_author: icerdv10086

theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到暗色模式
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到亮色模式
  features:
    - navigation.tabs
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

docs_dir: docs

nav:
  - 首页: index.md
  - 验证语言与UVM:
    - IC专用语法:
      - 数字模拟混合信号建模相关总结: "001-验证语言与UVM/IC专用语法/数字模拟混合信号建模相关总结.md"
  - 工具与实战:
    - EDA工具验证高频:
      - Verdi 覆盖率豁免避坑指南: "004-工具与实战/EDA工具验证高频/Verdi覆盖率豁免避坑指南.md"
      - VCS仿真资源分析（1）-reportstats: "004-工具与实战/EDA工具验证高频/VCS仿真资源分析（1）-reportstats.md"
      - VCS仿真资源分析（2）-simprofile与profrpt: "004-工具与实战/EDA工具验证高频/VCS仿真资源分析（2）-simprofile与profrpt.md"
    - 版本管理与知识库工具:
      - Git 工具使用: "004-工具与实战/版本管理与知识库工具/git工具使用.md"
      - CVS与SVN工具使用: "004-工具与实战/版本管理与知识库工具/CVS与SVN工具使用.md"
      - MkDocs配置与使用: "004-工具与实战/版本管理与知识库工具/mkdocs配置与使用.md"
      - GitHub与知识库构建: "004-工具与实战/版本管理与知识库工具/github与知识库构建.md"
    - 系统和文本:
      - YAML 语法手册: "004-工具与实战/系统与文本/yaml语法手册.md"
      - Markdown 语法手册: "004-工具与实战/系统与文本/markdwon语法手册.md"
      - JSON 语法手册: "004-工具与实战/系统与文本/json语法手册.md"
  - 验证流程与规范体系:
    - 后仿流程总览: "006-验证流程与规范体系/后仿流程总览.md"
    
exclude_docs: |
  site/**

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - footnotes
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.details
